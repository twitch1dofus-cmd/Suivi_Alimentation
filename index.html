<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --border:#e2e8f0;
    --accent:#2563eb; --accent-dark:#1e40af;
    --green:#c6efce; --green-ink:#256029;
    --orange:#ffe699; --orange-ink:#7a5b00;
    --red:#ffc7ce; --red-ink:#8a1c26;
    --blue:#bdd7ee; --blue-ink:#1e3a5f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:18px 24px;}
  header h1{margin:0;font-size:1.3rem;}
  header p{margin:4px 0 0;font-size:.85rem;opacity:.9;}
  nav{display:flex;gap:4px;background:#0f2557;padding:0 16px;overflow-x:auto;}
  nav button{background:none;border:none;color:#cbd5e1;padding:12px 16px;font-size:.9rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:#fff;border-bottom-color:#60a5fa;font-weight:600;}
  nav button:hover{color:#fff;}
  main{max-width:1200px;margin:0 auto;padding:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
  .card h2{margin:0 0 12px;font-size:1.05rem;}
  .card h3{margin:16px 0 8px;font-size:.95rem;color:var(--muted);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:800px){.grid2{grid-template-columns:1fr;}}
  label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px;}
  input,select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:.88rem;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field{margin-bottom:10px;}
  .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .row > *{flex:1;min-width:120px;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  th{background:#f8fafc;font-weight:600;color:var(--muted);position:sticky;top:0;}
  .tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:.85rem;cursor:pointer;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  .btn.danger{background:#fff;color:#b91c1c;border:1px solid #b91c1c;padding:4px 8px;font-size:.78rem;}
  .btn.small{padding:4px 8px;font-size:.78rem;}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;}
  .out{background:#f8fafc;border-radius:6px;padding:8px 10px;font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:4px;}
  .out b{font-variant-numeric:tabular-nums;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;margin-bottom:10px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .cell-green{background:var(--green);color:var(--green-ink);}
  .cell-orange{background:var(--orange);color:var(--orange-ink);}
  .cell-red{background:var(--red);color:var(--red-ink);}
  .cell-blue{background:var(--blue);color:var(--blue-ink);}
  .muted{color:var(--muted);}
  .modele-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;background:#fbfcfe;}
  .ing-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .ing-row select{flex:3;}
  .ing-row input{flex:1;}
  .totals-mini{font-size:.76rem;color:var(--muted);margin-top:8px;line-height:1.6;}
  .search{margin-bottom:10px;}
  .tag{font-size:.72rem;background:#eef2ff;color:#3730a3;border-radius:999px;padding:2px 8px;}
  .journal-group h4{margin:14px 0 6px;font-size:.85rem;color:var(--accent-dark);}
  .save-flash{position:fixed;bottom:16px;right:16px;background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;}
  .save-flash.show{opacity:.92;}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:20px;}
  .header-actions{display:flex;gap:8px;margin-top:10px;}
  .header-actions .btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);}
  .header-actions .btn:hover{background:rgba(255,255,255,.28);}
</style>
</head>

let state = load();

function load(){

      if(parsed && parsed.aliments && parsed.aliments.length) return parsed;
    }
  }catch(e){ console.warn('load failed', e); }
  return defaultState();
}
let saveTimer=null;

let applyingRemoteUpdate=false; // évite les boucles quand une mise à jour vient du cloud

// Remplis FIREBASE_CONFIG avec les valeurs de TON projet Firebase (Console > Paramètres du projet > Config SDK).
// Laisse apiKey vide (chaîne "") pour désactiver la synchronisation et rester en local uniquement.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCGcLMn-GEnm-QtOPmP3uisDhmIPxTmrBo",
  authDomain: "suivi-alimentaire-fa6a3.firebaseapp.com",
  projectId: "suivi-alimentaire-fa6a3",

  messagingSenderId: "1004640078056",
  appId: "1:1004640078056:web:71023a2e049088bba0a15d"
};
const CLOUD_DOC_PATH = { collection: 'suivi', doc: 'partage' }; // document unique partagé entre les deux téléphones
let cloudEnabled = !!FIREBASE_CONFIG.apiKey;
let cloudDb = null, cloudDocRef = null;
let cloudStatus = cloudEnabled ? 'connecting' : 'disabled'; // 'connecting' | 'online' | 'offline' | 'disabled'

function setCloudStatus(s){
  cloudStatus = s;
  const el = document.getElementById('cloudStatus');
  if(!el) return;
  const map = {
    connecting: ['🔄 Connexion…', ''],
    online: ['☁️ Synchronisé', 'color:#bbf7d0;'],
    offline: ['📴 Hors ligne (local uniquement)', 'color:#fecaca;'],
    disabled: ['💾 Local uniquement (Firebase non configuré)', 'color:#fde68a;']
  };
  const [txt, style] = map[s] || map.disabled;
  el.textContent = txt;
  el.style.cssText = style;
}

function initCloudSync(){
  if(!cloudEnabled){ setCloudStatus('disabled'); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    cloudDb = firebase.firestore();
    cloudDocRef = cloudDb.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc);
    setCloudStatus('connecting');
    cloudDocRef.onSnapshot((snap)=>{
      if(snap.exists){
        const remote = snap.data();
        if(remote && remote.payload){
          applyingRemoteUpdate = true;
          try{
            state = JSON.parse(remote.payload);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            renderAll();
          } finally { applyingRemoteUpdate = false; }
        }
      } else {
        // premier lancement : on pousse l'état local actuel comme référence initiale
        scheduleCloudWrite(true);
      }
      setCloudStatus('online');
    }, (err)=>{
      console.warn('Firestore sync error', err);
      setCloudStatus('offline');
    });
  }catch(e){
    console.warn('Firebase init failed', e);
    setCloudStatus('offline');
  }
}
function scheduleCloudWrite(immediate){
  if(!cloudEnabled || !cloudDocRef) return;
  clearTimeout(cloudWriteTimer);
  const doWrite = ()=>{
    cloudDocRef.set({ payload: JSON.stringify(state), updatedAt: Date.now() })
      .then(()=> setCloudStatus('online'))
      .catch((err)=>{ console.warn('Firestore write error', err); setCloudStatus('offline'); });
  };
  if(immediate) doWrite(); else cloudWriteTimer = setTimeout(doWrite, 600);
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmt(v, dec){ if(v===undefined||v===null||isNaN(v)) return '0'; return Number(v).toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }

/* ============================= CALCULS NUTRITION ============================= */
function bmr(o){
  return o.sexe==='H' ? 10*o.poids + 6.25*o.taille - 5*o.age + 5
                       : 10*o.poids + 6.25*o.taille - 5*o.age - 161;
}
function computeTargets(personne){
  const o = state.objectifs[personne];
  const b = bmr(o);
  const tdee = b * o.activite;
  const kcalObj = Math.max(tdee - o.deficit, 1400);
  const prot = o.protRatio * o.poids;
  const lip = (kcalObj * o.lipRatio) / 9;
  const gluc = Math.max((kcalObj - prot*4 - lip*9) / 4, 0);
  const fibres = (kcalObj/1000) * 14;
  const eau = o.poids * 0.033;
  const micros = state.micros[personne];
  return {
    bmr:b, tdee, kcal:kcalObj, prot, lip, gluc, fibres, eau,
    vitc:micros.vitc, vitd:micros.vitd, vita:micros.vita, vite:micros.vite, vitb12:micros.vitb12,
    ca:micros.ca, fe:micros.fe, mg:micros.mg, zn:micros.zn, k:micros.k, na:micros.na
  };
}
function poidsCible(personne, dateISO){
  const o = state.objectifs[personne];
  if(!dateISO) return o.poids;
  const debut = new Date(o.dateDebut);
  const d = new Date(dateISO);
  const jours = Math.max(0, Math.round((d-debut)/86400000));
  const projection = o.poids - (o.deficit * jours) / 7700;
  return o.sexe==='H'||true ? Math.max(o.poidsObjectif, projection) : projection;
}
function getAliment(nom){ return state.aliments.find(a=>a.nom===nom); }
function getModele(nom){ return state.modeles.find(m=>m.nom===nom); }

function computeModeleTotals(modele){
  const t = blankMetrics();
  (modele.ingredients||[]).forEach(ing=>{
    const al = getAliment(ing.ingredient);
    if(!al) return;
    const factor = (ing.qte||0)/100;
    METRICS.forEach(m=> t[m.key] += (al[m.key]||0)*factor);
  });
  return t;
}
// entry: {type:'aliment'|'modele', ref, qte}
function computeEntryTotals(entry){
  if(entry.type==='aliment'){
    const al = getAliment(entry.ref);
    const t = blankMetrics();
    if(!al) return t;
    const factor = (entry.qte||0)/100;
    METRICS.forEach(m=> t[m.key] = (al[m.key]||0)*factor);
    return t;
  } else {
    const mo = getModele(entry.ref);
    if(!mo) return blankMetrics();
    return computeModeleTotals(mo);
  }
}
function computeDayTotals(personne, dateISO){
  const entries = state.journal.filter(j=>j.personne===personne && j.date===dateISO);
  const t = blankMetrics();
  entries.forEach(e=>{
    const et = computeEntryTotals(e);
    METRICS.forEach(m=> t[m.key]+=et[m.key]);
  });
  return t;
}
function colorClass(type, target, actual){
  if(!target || target<=0) return '';
  const ratio = actual/target;
  if(type==='floor'){
    if(ratio>=1) return 'cell-green';
    if(ratio>=0.7) return 'cell-orange';
    return 'cell-red';
  } else {
    if(ratio<=1) return 'cell-green';
    if(ratio<=1.1) return 'cell-orange';
    return 'cell-blue';
  }
}

    </div>
    <div class="row">
      <div class="field" id="rp_refWrap"><label>Ingrédient</label><select id="rp_ref"></select></div>
      <div class="field" id="rp_qteWrap"><label>Quantité (g)</label><input type="number" id="rp_qte" value="100"></div>
    </div>
    <button class="btn" id="rp_add">+ Ajouter au journal</button>
  </div>
  <div class="card">
    <h2>Repas du ${date} — ${personne}</h2>
    <div id="rp_journal"></div>
  </div>`;
  app.appendChild(wrap);

  const refSel = wrap.querySelector('#rp_ref');
  const typeSel = wrap.querySelector('#rp_type');
  function refreshRefOptions(){
    const isAliment = typeSel.value==='aliment';
    wrap.querySelector('#rp_refWrap label').textContent = isAliment ? 'Ingrédient' : 'Repas prédéfini';
    wrap.querySelector('#rp_qteWrap').style.display = isAliment ? '' : 'none';
    const list = isAliment ? state.aliments.map(a=>a.nom) : state.modeles.map(m=>m.nom);
    refSel.innerHTML = list.map(n=>`<option>${n}</option>`).join('');
  }
  refreshRefOptions();
  typeSel.addEventListener('change', refreshRefOptions);

  wrap.querySelector('#rp_date').addEventListener('change', e=>{ renderRepas._date=e.target.value; renderRepas(); });
  wrap.querySelector('#rp_personne').addEventListener('change', e=>{ renderRepas._personne=e.target.value; renderRepas(); });

  wrap.querySelector('#rp_add').addEventListener('click', ()=>{
    const entry = {
      id: uid('j'),
      date, personne,
      creneau: wrap.querySelector('#rp_creneau').value,
      type: typeSel.value,
      ref: refSel.value,
      qte: typeSel.value==='aliment' ? (parseFloat(wrap.querySelector('#rp_qte').value)||0) : null
    };
    state.journal.push(entry);
    save();
    renderRepas();
  });

  // journal display grouped by créneau
  const journalDiv = wrap.querySelector('#rp_journal');
  const dayEntries = state.journal.filter(j=>j.date===date && j.personne===personne);
  let html = '';
  const dayTotal = blankMetrics();
  CRENEAUX.forEach(cr=>{
    const items = dayEntries.filter(e=>e.creneau===cr);
    if(!items.length) return;
    html += `<div class="journal-group"><h4>${cr}</h4><div class="tablewrap"><table><tr><th>Élément</th><th>Qté</th><th>Kcal</th><th>Prot.</th><th>Gluc.</th><th>Lip.</th><th></th></tr>`;
    items.forEach(e=>{
      const t = computeEntryTotals(e);
      MACRO_KEYS.forEach(k=>dayTotal[k]+=t[k]);
      html += `<tr><td>${e.ref}${e.type==='modele'?' <span class="tag">repas</span>':''}</td>
        <td>${e.type==='aliment'?e.qte+' g':'-'}</td>
        <td>${fmt(t.kcal,0)}</td><td>${fmt(t.prot,1)}</td><td>${fmt(t.gluc,1)}</td><td>${fmt(t.lip,1)}</td>
        <td><button class="btn danger small" data-deljr="${e.id}">✕</button></td></tr>`;
    });
    html += `</table></div></div>`;
  });
  // also add micro-nutrients into dayTotal (not displayed per-item but needed for total)
  const fullTotal = computeDayTotals(personne, date);
  if(!dayEntries.length){
    html += `<p class="muted">Aucun repas enregistré pour cette date.</p>`;
  } else {
    html += `<div class="out" style="margin-top:10px;"><span><strong>TOTAL DU JOUR</strong></span>
      <b>${fmt(fullTotal.kcal,0)} kcal · ${fmt(fullTotal.prot,1)}g prot · ${fmt(fullTotal.gluc,1)}g gluc · ${fmt(fullTotal.lip,1)}g lip · ${fmt(fullTotal.fibres,1)}g fibres</b></div>`;
  }
  journalDiv.innerHTML = html;
  journalDiv.querySelectorAll('[data-deljr]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.journal = state.journal.filter(j=>j.id!==b.dataset.deljr);
      save(); renderRepas();
    });
  });
}

/* ============================= TAB: SUIVI QUOTIDIEN ============================= */
function renderSuivi(){
  const app = document.getElementById('app');
  if(!renderSuivi._date) renderSuivi._date = todayISO();
  if(!renderSuivi._personne) renderSuivi._personne = 'Omar';
  const date = renderSuivi._date, personne = renderSuivi._personne;

  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="card">
    <h2>Suivi quotidien — cible vs réel</h2>
    <div class="legend">
      <span><i class="dot cell-green"></i> Objectif atteint</span>
      <span><i class="dot cell-orange"></i> Presque atteint</span>
      <span><i class="dot cell-red"></i> Loin de l'objectif</span>
      <span><i class="dot cell-blue"></i> Excès (attention santé)</span>
    </div>
    <div class="row">
      <div class="field"><label>Date</label><input type="date" id="sv_date" value="${date}"></div>
      <div class="field"><label>Personne</label><select id="sv_personne"><option ${personne==='Omar'?'selected':''}>Omar</option><option ${personne==='Meryem'?'selected':''}>Meryem</option></select></div>
      <div class="field"><label>Poids réel (kg)</label><input type="number" step="0.1" id="sv_poids" value="${getPoidsReel(personne,date)}"></div>
    </div>
    <div class="tablewrap"><table id="sv_table"></table></div>
  </div>
  <div class="card"><h2>Historique du poids — ${personne}</h2>
    <div class="tablewrap"><table id="sv_history"></table></div>
  </div>`;
  app.appendChild(wrap);

  wrap.querySelector('#sv_date').addEventListener('change', e=>{ renderSuivi._date=e.target.value; renderSuivi(); });
  wrap.querySelector('#sv_personne').addEventListener('change', e=>{ renderSuivi._personne=e.target.value; renderSuivi(); });
  wrap.querySelector('#sv_poids').addEventListener('change', e=>{
    setPoidsReel(personne, date, parseFloat(e.target.value)||0);
    save(); renderSuivi();
  });

  const targets = computeTargets(personne);
  const actual = computeDayTotals(personne, date);
  const table = wrap.querySelector('#sv_table');
  let rows = `<tr><th>Métrique</th><th>Cible</th><th>Réel</th><th>Écart</th></tr>`;
  const pCible = poidsCible(personne, date);
  const pReel = getPoidsReel(personne, date);
  const poidsClass = pReel ? (Math.abs(pReel-pCible)<=0.5?'cell-green':(Math.abs(pReel-pCible)<=1.5?'cell-orange':'cell-red')) : '';
  rows += `<tr class="${poidsClass}"><td><strong>Poids (kg)</strong></td><td>${fmt(pCible,1)}</td><td>${pReel?fmt(pReel,1):'—'}</td><td>${pReel?fmt(pReel-pCible,1):'—'}</td></tr>`;
  METRICS.forEach(m=>{
    const cible = targets[m.key];
    const reel = actual[m.key];
    const cls = colorClass(m.type, cible, reel);
    rows += `<tr class="${cls}"><td>${m.label} ${m.unit?'('+m.unit+')':''}</td><td>${fmt(cible,m.dec)}</td><td>${fmt(reel,m.dec)}</td><td>${fmt(reel-cible,m.dec)}</td></tr>`;
  });
  table.innerHTML = rows;

  // history
  const hist = wrap.querySelector('#sv_history');
  const poidsList = state.poids.filter(p=>p.personne===personne).sort((a,b)=>a.date.localeCompare(b.date));
  if(!poidsList.length){
    hist.innerHTML = `<tr><td class="muted">Aucune pesée enregistrée.</td></tr>`;
  } else {
    let h = `<tr><th>Date</th><th>Poids cible</th><th>Poids réel</th><th>Écart</th></tr>`;
    poidsList.forEach(p=>{
      const c = poidsCible(personne, p.date);
      const cls = Math.abs(p.reel-c)<=0.5?'cell-green':(Math.abs(p.reel-c)<=1.5?'cell-orange':'cell-red');
      h += `<tr class="${cls}"><td>${p.date}</td><td>${fmt(c,1)}</td><td>${fmt(p.reel,1)}</td><td>${fmt(p.reel-c,1)}</td></tr>`;
    });
    hist.innerHTML = h;
  }
}
function getPoidsReel(personne, date){
  const e = state.poids.find(p=>p.personne===personne && p.date===date);
  return e ? e.reel : '';
}
function setPoidsReel(personne, date, val){
  let e = state.poids.find(p=>p.personne===personne && p.date===date);
  if(!e){ e = {personne, date, reel:val}; state.poids.push(e); }
  else e.reel = val;
}

/* ============================= EXPORT / IMPORT ============================= */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `suivi_alimentaire_sauvegarde_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      alert("Ce fichier n'est pas un JSON valide, import annulé.");
      return;
    }
    if(!parsed || !Array.isArray(parsed.aliments) || !parsed.objectifs){
      alert("Ce fichier ne ressemble pas à une sauvegarde de ce site (structure inattendue), import annulé.");
      return;
    }
    if(!confirm("Importer cette sauvegarde va REMPLACER toutes les données actuelles de ce navigateur (aliments, repas, poids, objectifs). Continuer ?")){
      return;
    }
    state = parsed;
    // combler d'éventuels champs manquants pour compatibilité future
    if(!state.journal) state.journal = [];
    if(!state.poids) state.poids = [];
    if(!state.modeles) state.modeles = [];
    if(!state.micros) state.micros = JSON.parse(JSON.stringify(SEED_MICROS));
    save();
    alert("Sauvegarde importée avec succès.");
    renderAll();
  };
  reader.readAsText(file);
}
document.getElementById('btnExport').addEventListener('click', exportBackup);
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e)=>{
  if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

/* ============================= PWA (service worker) ============================= */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* pas d'hébergement HTTPS: ignoré silencieusement */ });
  });
}

/* ============================= INIT ============================= */
renderAll();
initCloudSync();
</script>
